.htitle{font-family:Manrope;font-weight:800;font-size:22px}
.hsub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.spacer{flex:1}
.vswitch{display:flex;gap:14px;margin-bottom:18px}
.vbtn{flex:1;max-width:360px;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:16px;padding:18px 22px;transition:.18s;display:flex;align-items:center;gap:16px}
.vbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.vbtn .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:Manrope;font-weight:800;font-size:20px;color:#04263b}
.vbtn.sn .ic{background:var(--sn)}.vbtn.te .ic{background:var(--te);color:#1a0f33}
.vbtn .t{font-family:Manrope;font-weight:800;font-size:18px}.vbtn .s{color:var(--ink2);font-size:12px;margin-top:2px}
.vbtn.active.sn{border-color:var(--sn);box-shadow:0 0 0 2px var(--sn) inset}
.vbtn.active.te{border-color:var(--te);box-shadow:0 0 0 2px var(--te) inset}
.vbtn:not(.active){opacity:.62}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.ctl label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:5px}
select,input[type=text]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input[type=text]{min-width:230px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:26px 28px}
.kpi .lab{color:var(--ink2);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.kpi .val{font-family:Manrope;font-weight:800;font-size:42px;margin-top:10px}
.kpi .val .u{color:var(--accent);font-size:16px;margin-left:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tablewrap{overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th,td{padding:9px 11px;text-align:right;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:3;background:#0b1730;color:var(--ink2);font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
th.lft,td.lft{text-align:left}
.col-name{position:sticky;left:0;z-index:2;background:var(--panel);min-width:225px;max-width:330px;white-space:normal;border-right:1px solid var(--line)}
thead th.col-name{z-index:4}
.col-cargo{position:sticky;left:225px;z-index:2;background:var(--panel);min-width:165px;white-space:normal;border-right:1px solid var(--line);color:var(--ink2);font-size:12px}
thead th.col-cargo{z-index:4}
td.stick-r,th.stick-r{position:sticky;right:0;z-index:2;background:var(--panel);border-left:2px solid var(--accent)}
thead th.stick-r{z-index:4;background:#0b1730}
tfoot td.stick-r{z-index:4;background:#0b1730}
tbody tr.grp{cursor:pointer;border-bottom:1px solid #18243f}
tbody tr.grp:hover td{background:#15233f}
tbody tr.grp:hover td.stick-r{background:#15233f}
.gname{font-weight:600}.gname .caret{color:var(--accent);display:inline-block;width:14px;transition:.15s}
tr.open .caret{transform:rotate(90deg)}
.pc{color:var(--ink2);font-size:11px;margin-left:4px}
.sub td{background:#0a1428;color:var(--ink2);font-size:12.5px;border-bottom:1px solid #16213b}
.sub td.stick-r{background:#0a1428}
.sub td.lbl{color:var(--ink);font-weight:600}
.subhdr{color:var(--accent)!important;font-weight:700!important}
.year-col{border-left:1px solid var(--accent);color:var(--ink)}.grand{border-left:2px solid var(--accent)}
tfoot td{position:sticky;bottom:0;background:#0b1730;border-top:1px solid var(--accent);font-weight:700;z-index:3}
.bars{display:flex;flex-direction:column;gap:9px;padding:6px 2px}
.barrow{display:grid;grid-template-columns:64px 1fr 150px;align-items:center;gap:12px}
.barrow .ml{color:var(--ink2);font-size:12px}
.bar{height:18px;border-radius:6px;background:#10203b;overflow:hidden;display:flex}
.bseg.b{background:linear-gradient(90deg,#2aa0ff,#3FB8FF)}.bseg.n{background:linear-gradient(90deg,#ff7a86,#ff5d6c)}
.legend{display:flex;gap:18px;color:var(--ink2);font-size:12.5px;margin:6px 2px 2px}
.legend span{display:inline-flex;align-items:center;gap:7px}.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{color:var(--ink2);font-size:12px;margin-top:14px;line-height:1.55}
.xbtn{cursor:pointer;border:1px solid var(--accent);background:linear-gradient(180deg,#1c8f6e,#15795c);color:#eafff8;font-weight:700;font-family:inherit;font-size:13px;border-radius:10px;padding:10px 16px}
.xbtn:hover{filter:brightness(1.1)}
.pill{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.roster{border-collapse:collapse;width:100%}
.roster th,.roster td{padding:11px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.roster th{color:var(--accent);text-align:right;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.roster th.lft,.roster td.lft{text-align:left;color:var(--ink)}
.roster td{text-align:right;color:var(--ink)}
.roster tbody tr:nth-child(odd) td{background:#0d1830}
.roster tfoot td{font-weight:800;border-top:2px solid var(--accent);color:#fff;font-size:15px}
.foot{margin-top:18px;color:var(--ink2);font-size:11.5px;border-top:1px solid var(--line);padding-top:12px}
</style></head>

 for(const [ai,mi,vt,h] of RAW.investdata){if(vt!==state.vert)continue;const lab=RAW.investact[ai];if(!map.has(lab))map.set(lab,Array.from({length:MONTHS.length},()=>0));map.get(lab)[mi]+=h;}
 const base=Array.from({length:MONTHS.length},()=>0);for(const m of map.values())m.forEach((v,i)=>base[i]+=v);
 let rows=[...map.entries()].map(([label,m])=>({label,m}));
 if(state.q){const q=state.q.toLowerCase();rows=rows.filter(r=>r.label.toLowerCase().includes(q));}
 rows.sort((a,b)=>sumArr(b.m,mis)-sumArr(a.m,mis)); rows=rows.filter(r=>sumArr(r.m,mis)>0);
 document.getElementById('rowcount').textContent=rows.length+" rows";
 function rng(c){return c.t==="m"?[c.i]:c.t==="sub"?mis.filter(i=>MONTHS[i].startsWith(c.y)):mis;}
 const clsOf=c=>(c.t==="sub"?"year-col":c.t==="tot"?"grand":"")+(c.stick?" stick-r":"");
 let h='<div class="panel"><div class="tablewrap"><table><thead><tr><th class="lft col-name">Investment Line — hours</th>';
 cols.forEach(c=>{h+=`<th class="${c.stick?'stick-r':(c.t==='sub'?'year-col':c.t==='tot'?'grand':'')}">${c.t==="m"?mLabel(c.i):c.t==="sub"?c.y:"Total"}</th>`;});
 h+='</tr></thead><tbody>';
 rows.forEach(r=>{h+=`<tr class="grp"><td class="lft col-name gname">${r.label}</td>`;
  cols.forEach(c=>{const R=rng(c);const v=sumArr(r.m,R),bs=sumArr(base,R);const pct=bs>0?v/bs*100:0;
   const st=v>0?`background-color:#0b1730;background-image:linear-gradient(0deg,rgba(63,184,255,${Math.min(.5,pct/100*0.6)}),rgba(63,184,255,${Math.min(.5,pct/100*0.6)}))`:"";
   h+=`<td class="${clsOf(c)}" style="${st}">${v>0?fmtH(v):''}</td>`;});
  h+='</tr>';});
 h+='</tbody><tfoot><tr><td class="lft col-name">Total Investment</td>';
 cols.forEach(c=>{const R=rng(c);const bs=sumArr(base,R);h+=`<td class="${clsOf(c)}">${bs>0?fmtH(bs):''}</td>`;});
 h+='</tr></tfoot></table></div></div>';
 document.getElementById('content').innerHTML=h;
}
function renderGeral(){
 const mis=monthsFor(state.year),map=aggregate();const mt=Array.from({length:MONTHS.length},()=>[0,0]);
 for(const o of map.values())o.m.forEach((p,i)=>{mt[i][0]+=p[0];mt[i][1]+=p[1];});
 let yb=0,yn=0;mis.forEach(i=>{yb+=mt[i][0];yn+=mt[i][1];});const T=yb+yn;
 const np=new Set(DATA.filter(d=>mis.includes(d[2])&&PEOPLE[d[0]].v===state.vert).map(d=>d[0])).size;
 let invH=0;for(const [ai,mi,vt,hh] of (RAW.investdata||[])){if(vt===state.vert&&mis.includes(mi))invH+=hh;}
 const k=(l,v,u="")=>`<div class="kpi"><div class="lab">${l}</div><div class="val">${v}${u?'<span class="u">'+u+'</span>':''}</div></div>`;
 let h='<div class="kpis">'+k("Total Logged",fmtH(T+invH),"h")+k("% Billable",fmtP(T?yb/T*100:0))+k("% Non-Billable",(T?yn/T*100:0).toFixed(1)+"%")+k("Billable Hours",fmtH(yb),"h")+k("Non-Billable Hours",fmtH(yn),"h")+k("Investment",fmtH(invH),"h")+k("People",np)+'</div>';
 h+='<div class="panel" style="padding:18px 22px;margin-top:4px;max-width:640px">'+'<div style="font-family:Manrope;font-weight:800;font-size:17px;margin-bottom:14px">Employee Roster</div>'+'<table class="roster"><thead><tr><th class="lft">Department</th><th>Total</th></tr></thead><tbody>'+'<tr><td class=\"lft\">Delivery Service · Billable</td><td>129</td></tr><tr><td class=\"lft\">Delivery Service · Overhead</td><td>8</td></tr><tr><td class=\"lft\">Delivery Tech</td><td>24</td></tr><tr><td class=\"lft\">Admin/Fin</td><td>4</td></tr><tr><td class=\"lft\">Sales & Marketing</td><td>11</td></tr><tr><td class=\"lft\">PMO</td><td>1</td></tr><tr><td class=\"lft\">HR</td><td>5</td></tr>'+'</tbody><tfoot><tr><td class="lft">Total</td><td>182</td></tr></tfoot></table></div>';
 
 
 document.getElementById('content').innerHTML=h;
}
function paint(){
 document.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('active',x.dataset.v===state.vert));
 document.getElementById('hsub').textContent='Processed · Oct/2023 to Jun/2026 (partial)';
}
function render(){
 paint();const v=state.view;
 document.getElementById('metricCtl').style.display=(v==="geral"||v==="nb"||v==="invest")?'none':'';
 document.getElementById('sortCtl').style.display=(v==="geral")?'none':'';
 document.getElementById('searchCtl').style.display=(v==="pessoa"||v==="nb"||v==="invest")?'':'none';
 document.getElementById('rowcount').style.display=(v==="geral")?'none':'';
 if(v==="geral")renderGeral();else if(v==="nb")renderNB();else if(v==="invest")renderInvest();else renderTable();
}
document.getElementById('vswitch').onclick=e=>{const b=e.target.closest('.vbtn');if(!b)return;state.vert=b.dataset.v;state.open.clear();render();};
document.getElementById('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');state.view=t.dataset.t;state.open.clear();state.q="";document.getElementById('q').value="";render();};
document.getElementById('year').onchange=e=>{state.year=e.target.value;render();};
document.getElementById('metric').onchange=e=>{state.metric=e.target.value;render();};
document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
document.getElementById('q').oninput=e=>{state.q=e.target.value;render();};

function _cols(){return buildCols(monthsFor(state.year));}
function _hcols(cols){return cols.map(c=>c.t==="m"?mLabel(c.i):c.t==="sub"?c.y:"Total");}
function _sheetEnt(view){
 const mis=monthsFor(state.year),cols=buildCols(mis),map=aggregate(view);
 let rows=[...map.values()];
 rows.sort((a,b)=>{const ra=sumRange(a,mis),rb=sumRange(b,mis);return (rb[0]+rb[1])-(ra[0]+ra[1]);});rows=rows.filter(r=>{const x=sumRange(r,mis);return (x[0]+x[1])>0;});
 const showCargo=view==="pessoa";
 const hdr=view==="pessoa"?"Person":view==="cargo"?"Title (current)":"Role (as-of)";
 const head=[hdr]; if(showCargo)head.push("Title (current)");
 _hcols(cols).forEach(x=>head.push(x));
 const aoa=[["% Não Billable por mês"],head];
 rows.forEach(r=>{const ln=[r.label]; if(showCargo)ln.push(r.cargo||"");
  cols.forEach(c=>{let b,n;if(c.t==="m"){b=r.m[c.i][0];n=r.m[c.i][1];}else if(c.t==="sub"){[b,n]=sumRange(r,mis.filter(i=>MONTHS[i].startsWith(c.y)));}else{[b,n]=sumRange(r,mis);} const t=b+n; ln.push(t>0?Math.round(n/t*100):"");});
  aoa.push(ln);});
 // linha total geral
 const tot=cols.map(()=>[0,0]); rows.forEach(r=>cols.forEach((c,ci)=>{let b,n;if(c.t==="m"){b=r.m[c.i][0];n=r.m[c.i][1];}else if(c.t==="sub"){[b,n]=sumRange(r,mis.filter(i=>MONTHS[i].startsWith(c.y)));}else{[b,n]=sumRange(r,mis);}tot[ci][0]+=b;tot[ci][1]+=n;}));
 const tl=["Grand total"]; if(showCargo)tl.push(""); tot.forEach(f=>{const t=f[0]+f[1];tl.push(t>0?Math.round(f[1]/t*100):"");}); aoa.push(tl);
 return XLSX.utils.aoa_to_sheet(aoa);
}
function _sheetNB(){
 const mis=monthsFor(state.year),cols=buildCols(mis),map=new Map();
 for(const [ai,mi,vt,n] of RAW.nbdata){if(vt!==state.vert)continue;const lab=RAW.nbact[ai];if(!map.has(lab))map.set(lab,Array.from({length:MONTHS.length},()=>0));map.get(lab)[mi]+=n;}
 let rows=[...map.entries()].map(([label,m])=>({label,m})); rows.sort((a,b)=>sumArr(b.m,mis)-sumArr(a.m,mis)); rows=rows.filter(r=>sumArr(r.m,mis)>0);
 const head=["Activity (non-billable) — horas"]; _hcols(cols).forEach(x=>head.push(x)); const aoa=[head];
 const base=cols.map(()=>0);
 rows.forEach(r=>{const ln=[r.label]; cols.forEach((c,ci)=>{const R=c.t==="m"?[c.i]:c.t==="sub"?mis.filter(i=>MONTHS[i].startsWith(c.y)):mis; const v=sumArr(r.m,R); base[ci]+=v; ln.push(Math.round(v));}); aoa.push(ln);});
 const tl=["Total Non-Billable"]; base.forEach(v=>tl.push(Math.round(v))); aoa.push(tl);
 return XLSX.utils.aoa_to_sheet(aoa);
}

 let yb=0,yn=0;mis.forEach(i=>{yb+=mt[i][0];yn+=mt[i][1];});const T=yb+yn;
 const np=new Set(DATA.filter(d=>mis.includes(d[2])&&PEOPLE[d[0]].v===state.vert).map(d=>d[0])).size;
 return XLSX.utils.aoa_to_sheet([["Report Executivo de Horas — "+VLAB[state.vert]],["Período",document.getElementById('year').selectedOptions[0].text],[],
  ["Indicador","Valor"],["Total Logged (h)",Math.round(T)],["% Billable",T?Math.round(yb/T*100):0],["% Non-Billable",T?Math.round(yn/T*100):0],["Billable Hours",Math.round(yb)],["Non-Billable Hours",Math.round(yn)],["People",np]]);
}
