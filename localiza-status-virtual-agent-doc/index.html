<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Status do Projeto</title>
<style>
  :root{
    --green:#1f9d67;
    --amber:#e0a527;
    --gray:#b8c0c8;
    --red:#d9534f;
    --navy:#0f2e3d;
    --ink:#1c2b33;
    --muted:#5c6b74;
    --bg:#f4f6f7;
    --card:#ffffff;
    --border:#e3e8ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:32px 24px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:28px;
  }
  header h1{font-size:26px;margin:0 0 4px;color:var(--navy);}
  header p{margin:0;color:var(--muted);font-size:14px;}
  .badge-live{
    background:var(--navy);color:#fff;padding:6px 14px;border-radius:20px;
    font-size:13px;font-weight:600;white-space:nowrap;
  }

  .kpis{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-bottom:24px;
    max-width:600px;
  }
  .kpi{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:18px 20px;
  }
  .kpi .num{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1;}
  .kpi .lbl{font-size:13px;color:var(--ink);margin-top:4px;font-weight:600;}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .kpi.highlight{background:linear-gradient(135deg,#0f2e3d,#1a4a5e);}
  .kpi.highlight .num,.kpi.highlight .lbl{color:#fff;}
  .kpi.highlight .sub{color:#cfe3e9;}

  .grid2{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:20px 16px;
  }
  .card h2{font-size:15px;margin:0 0 16px;color:var(--navy);}

  .donut-row{display:flex;align-items:center;gap:12px;}
  .donut{
    width:128px;height:128px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .donut::after{
    content:"";width:78px;height:78px;border-radius:50%;background:var(--card);
  }
  .donut-center{
    position:relative;
  }
  .donut-label{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;
  }
  .donut-label .pct{font-size:21px;font-weight:700;color:var(--navy);}
  .donut-label .txt{font-size:10px;color:var(--muted);}

  .legend{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0;}
  .legend .row{
    display:flex;justify-content:space-between;gap:8px;cursor:pointer;
    padding:7px 8px;border-radius:8px;margin:0 -8px;transition:background .15s;
    white-space:nowrap;
  }
  .legend .row:hover{background:#f4f6f7;}
  .legend .row.active{background:#eef1f2;font-weight:700;}
  .legend .row.active .n{color:var(--navy);}
  .legend .l{display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend .n{color:var(--muted);font-weight:600;}

  .list-card h2{display:flex;align-items:center;gap:8px;}
  .list-card .count-badge, .count-badge{
    font-size:11.5px;font-weight:700;background:#eef1f2;color:var(--muted);
    border-radius:10px;padding:1px 9px;
  }

  .bar-track{background:#eef1f2;border-radius:8px;height:12px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;display:block;width:0;}

  .stepper{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:8px 4px 0;}
  .stepper::before{
    content:"";position:absolute;top:26px;left:6%;right:6%;height:2px;background:var(--border);
  }
  .step{position:relative;flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .step .circ{
    width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--gray);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);z-index:1;
  }
  .step.dev .circ{border-color:var(--amber);color:var(--amber);background:#fff8e8;}
  .step.done .circ{border-color:var(--green);color:#fff;background:var(--green);}
  .step .name{font-size:12.5px;font-weight:600;color:var(--ink);max-width:150px;}
  .step .status{font-size:11.5px;color:var(--muted);}
  .step .date{font-size:11px;color:var(--muted);}
  .step.dev .status{color:#8a6d1f;font-weight:600;}
  .step.clickable{cursor:pointer;}
  .step.clickable .name{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;}
  .step.clickable:hover .circ{box-shadow:0 0 0 4px rgba(15,46,61,.08);}
  .step.clickable.open .circ{box-shadow:0 0 0 4px rgba(15,46,61,.14);}

  .phase-panel{
    display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);
  }

  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
  ul.list li{
    display:flex;gap:10px;font-size:13.5px;line-height:1.45;
  }
  ul.list li .mark{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;margin-top:1px;
  }
  .mark.done{background:var(--green);}
  .mark.wip{background:var(--amber);}
  .mark.blocked{background:var(--red);}
  .mark.todo{background:var(--gray);color:var(--navy);}
  .tag-cliente{font-size:11px;color:#8a3226;background:#fdeae6;padding:1px 8px;border-radius:8px;margin-left:6px;white-space:nowrap;}

  footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center;}

  @media (max-width:800px){
    .kpis{grid-template-columns:1fr;max-width:none;}
    .grid2{grid-template-columns:1fr;}
  }

  .section-title{font-size:18px;color:var(--navy);margin:32px 0 16px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="proj-title">Status do Projeto</h1>
      <p id="proj-sub"></p>
    </div>
    <div class="badge-live" id="badge-golive"></div>
  </header>

  <div class="kpis">
    <div class="kpi">
      <div class="num" id="kpi-pct-num">–</div>
      <div class="lbl">do desenvolvimento concluído</div>
      <div class="sub" id="kpi-pct-sub"></div>
    </div>
    <div class="kpi highlight">
      <div class="num" id="kpi-scope-num"></div>
      <div class="lbl" id="kpi-scope-lbl"></div>
      <div class="sub" id="kpi-scope-sub"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <h2>Fases do projeto</h2>
    <div class="stepper">
      <div class="step done">
        <div class="circ">✓</div>
        <div class="name" id="phase-assessment-name"></div>
        <div class="status" id="phase-assessment-status"></div>
        <div class="date" id="phase-assessment-date"></div>
      </div>
      <div class="step dev clickable" id="phase-step-dev" onclick="togglePhase('dev')">
        <div class="circ" id="phase-dev-circ"></div>
        <div class="name" id="phase-dev-name"></div>
        <div class="status" id="phase-dev-status"></div>
        <div class="date" id="phase-dev-date"></div>
      </div>
      <div class="step clickable" id="phase-step-hml" onclick="togglePhase('hml')">
        <div class="circ">3</div>
        <div class="name" id="phase-hml-name"></div>
        <div class="status" id="phase-hml-status"></div>
        <div class="date" id="phase-hml-date"></div>
      </div>
      <div class="step clickable" id="phase-step-golive" onclick="togglePhase('golive')">
        <div class="circ">4</div>
        <div class="name" id="phase-golive-name"></div>
        <div class="status" id="phase-golive-status"></div>
        <div class="date" id="phase-golive-date"></div>
      </div>
    </div>

    <div class="phase-panel" id="phase-hml">
      <ul class="list" id="list-hml"></ul>
    </div>

    <div class="phase-panel" id="phase-golive">
      <ul class="list" id="list-golive"></ul>
    </div>
  </div>

  <div class="dev-details" id="dev-details" style="display:none;">
  <div class="grid2">
    <div class="card">
      <h2>Completude do desenvolvimento</h2>
      <div class="donut-row">
        <div class="donut-center">
          <div class="donut" id="donut"></div>
          <div class="donut-label"><div class="pct" id="donut-pct-label"></div><div class="txt">concluído</div></div>
        </div>
        <div class="legend">
          <div class="row active" data-tab="done" onclick="showTab('done')"><span class="l"><span class="dot" style="background:var(--green)"></span><span id="legend-label-done"></span></span><span class="n" id="legend-n-done"></span></div>
          <div class="row" data-tab="wip" onclick="showTab('wip')"><span class="l"><span class="dot" style="background:var(--amber)"></span><span id="legend-label-wip"></span></span><span class="n" id="legend-n-wip"></span></div>
          <div class="row" data-tab="blocked" onclick="showTab('blocked')"><span class="l"><span class="dot" style="background:var(--red)"></span><span id="legend-label-blocked"></span></span><span class="n" id="legend-n-blocked"></span></div>
          <div class="row" data-tab="todo" onclick="showTab('todo')"><span class="l"><span class="dot" style="background:var(--gray)"></span><span id="legend-label-todo"></span></span><span class="n" id="legend-n-todo"></span></div>
        </div>
      </div>
    </div>

    <div class="card list-card">
      <h2 id="list-title"></h2>
      <ul class="list" id="list-done"></ul>
      <ul class="list" id="list-wip" style="display:none;"></ul>
      <ul class="list" id="list-blocked" style="display:none;"></ul>
      <ul class="list" id="list-todo" style="display:none;"></ul>
    </div>
  </div>

  <h2 class="section-title">Documentação & evidências de teste</h2>
  <div class="grid2">
    <div class="card">
      <h2>Documentações <span class="count-badge" id="docs-badge"></span></h2>
      <div class="bar-track" style="margin-bottom:18px;"><div class="bar-fill" id="docs-bar" style="background:var(--green);"></div></div>
      <ul class="list" id="list-docs"></ul>
    </div>

    <div class="card">
      <h2>Evidências de teste <span class="count-badge" id="evid-badge"></span></h2>
      <div class="bar-track" style="margin-bottom:18px;"><div class="bar-fill" id="evid-bar" style="background:var(--green);"></div></div>
      <ul class="list" id="list-evid"></ul>
    </div>
  </div>
  </div>

</div>

<script>
/* ============================================================
   DADOS DO PROJETO — edite só esta seção e salve o arquivo.
   O restante da página (percentuais, gráfico, listas) é
   recalculado e preenchido automaticamente ao abrir o HTML.
   status possíveis: "done" (concluído), "wip" (em andamento),
   "blocked" (pendência/bloqueio), "todo" (a iniciar)
   ============================================================ */
var DATA = {

  meta: {
    projectName: "GT Catálogo Guiado",
    client: "Localiza",
    platform: "ServiceNow",
    updatedAt: "16 de julho de 2026",
    goLiveDate: "17/08/2026"
  },

  // Card de destaque (KPI da direita, em azul)
  scopeWin: {
    value: "45+",
    label: "catálogos conversacionais entregues",
    sub: "vs. 13 previstos no escopo (3,5x)"
  },

  // Nomes exibidos para cada status (usados na legenda do gráfico e no título da lista)
  statusLabels: {
    done: "Concluído",
    wip: "Em andamento",
    blocked: "Pendências",
    todo: "A iniciar"
  },

  // Lista principal de atividades do desenvolvimento.
  // Adicione/edite itens livremente — o % concluído e o gráfico se recalculam sozinhos.
  // "client:true" marca pendência que depende da Localiza (mostra a tag "Localiza").
  activities: [
    {name:"Instalação de plugins", status:"done"},
    {name:"AI Agent - Enriquecimento de Descrições", status:"done"},
    {name:"AI Agent - Enriquecimento de Catálogo único", status:"done"},
    {name:"API Conect - Definição de informações obrigatórias de Envio e Recebimento", status:"done"},
    {name:"Disponibilizar requisitos necessários - Sharepoint", status:"done"},
    {name:"Disponibilizar requisitos necessários - Microsoft Azure / Entra ID", status:"done"},
    {name:"Configuração inicial do bot primário", status:"done"},
    {name:"Ativação do chat com LLM", status:"done"},
    {name:"Configuração de mensagens iniciais e saudações", status:"done"},
    {name:"Remoção do widget existente no portal Localiza", status:"done"},
    {name:"Remoção dos links existentes no portal Localiza", status:"done"},
    {name:"Configuração do widget no portal da Localiza", status:"done"},
    {name:"Configuração do comportamento de fallback", status:"done"},
    {name:"Configuração inicial das fontes de conhecimento", status:"done"},
    {name:"Testes unitários de direcionamento de catálogo", status:"done"},
    {name:"Corrigir Warning (requisito para catálogos conversacionais)", status:"done"},
    {name:"Ativação dos itens conversacionais", status:"done"},
    {name:"Integração com o Teams", status:"done"},
    {name:"Desenvolvimento da estrutura das notificações proativas no Teams (Liza)", status:"done"},
    {name:"Configuração do bot interconnect para conexão com Connect", status:"done"},
    {name:"Configuração do branding da Liza (cores, foto, nome)", status:"done"},

    {name:"Integração com a Amazon Connect — identificação da intenção do usuário para roteamento entre os flows do Connect", status:"wip"},
    {name:"Notificações de aprovação no Teams", status:"wip"},

    {name:"Parametrizações na Azure para conexão com o SharePoint", status:"blocked", client:true},
    {name:"Alterações no flow de troca de senha do Connect — evitar perda de mensagens por +1 de post", status:"blocked", client:true},
    {name:"Alteração no flow de troca de senha do Connect — envio do step de senha via texto (SN devolve senha criptografada)", status:"blocked", client:true},
    {name:"Compartilhamento dos flowIDs do Connect mapeados com objetivos, para roteamento via bot primário", status:"blocked", client:true},

    {name:"Conexão com o SharePoint", status:"todo"},
    {name:"Ajuste na fonte de pesquisa do VA para incluir o site do SharePoint", status:"todo"},
    {name:"Relatórios & Dashboards", status:"todo"}
  ],

  // Fases do projeto (linha do tempo clicável)
  phases: {
    assessment: {
      name: "Assessment",
      statusLabel: "Concluído",
      date: "15/05/2026"
    },
    dev: {
      name: "Desenvolvimento",
      statusLabel: "Em andamento",
      dateRange: "15/05 → 04/08/2026"
      // o círculo (%) é calculado a partir de "activities" acima
    },
    hml: {
      name: "Disponibilização em homologação",
      statusLabel: "A iniciar",
      date: "04/08/2026",
      activities: [
        {name:"Instalação dos plugins no ambiente de homologação", status:"todo"},
        {name:"Subida de todos os update sets", status:"todo"},
        {name:"Homologação do Virtual Agent no Portal", status:"todo"},
        {name:"Homologação do Virtual Agent no Teams", status:"todo"},
        {name:"Homologação dos catálogos conversacionais", status:"todo"}
      ]
    },
    golive: {
      name: "Go-live",
      statusLabel: "Previsto",
      date: "17/08/2026",
      activities: [
        {name:"Criação da Liza de produção", status:"todo"},
        {name:"Criação da aplicação do SharePoint de produção", status:"todo"},
        {name:"Instalação dos plugins em produção", status:"todo"},
        {name:"Subida dos update sets em produção", status:"todo"},
        {name:"Hypercare", status:"todo"}
      ]
    }
  },

  // Documentações que precisam ser entregues
  documentacoes: [
    {name:"Boas práticas para desenvolvimento de catálogos conversacionais", status:"wip"},
    {name:"Integração do bot Interconnect", status:"todo"},
    {name:"Estrutura de notificações proativas com Adaptive Cards", status:"done"},
    {name:"Notificações de aprovação no Teams", status:"todo"},
    {name:"Configurações do bot", status:"todo"}
  ],

  // Evidências de teste
  evidencias: [
    {name:"Direcionamento de catálogo", status:"done"},
    {name:"Adaptive Cards no Teams", status:"done"},
    {name:"Catálogos conversacionais", status:"wip"}
  ]
};
/* ======================= FIM DOS DADOS ======================= */


/* ================= RENDERIZAÇÃO (não precisa mexer) ================= */
var STATS = null;

function statusIcon(status){
  if(status === 'done') return '✓';
  if(status === 'blocked') return '!';
  return '•';
}

function renderItem(item){
  var tag = item.client ? ' <span class="tag-cliente">Localiza</span>' : '';
  return '<li><span class="mark ' + item.status + '">' + statusIcon(item.status) + '</span> ' + item.name + tag + '</li>';
}

function renderMeta(){
  document.title = 'Status do Projeto — ' + DATA.meta.projectName;
  document.getElementById('proj-title').textContent = 'Status do Projeto — ' + DATA.meta.projectName;
  document.getElementById('proj-sub').textContent = DATA.meta.client + ' · ' + DATA.meta.platform + ' · atualizado em ' + DATA.meta.updatedAt;
  document.getElementById('badge-golive').textContent = 'Go-live previsto: ' + DATA.meta.goLiveDate;

  document.getElementById('kpi-scope-num').textContent = DATA.scopeWin.value;
  document.getElementById('kpi-scope-lbl').textContent = DATA.scopeWin.label;
  document.getElementById('kpi-scope-sub').textContent = DATA.scopeWin.sub;
}

function renderActivities(){
  var order = ['done','wip','blocked','todo'];
  var counts = {done:0, wip:0, blocked:0, todo:0};
  DATA.activities.forEach(function(a){ counts[a.status] = (counts[a.status]||0) + 1; });
  var total = DATA.activities.length;
  var pct = {};
  order.forEach(function(k){ pct[k] = total ? Math.round(counts[k] / total * 100) : 0; });

  STATS = {counts:counts, pct:pct, total:total};

  // KPI principal
  document.getElementById('kpi-pct-num').textContent = pct.done + '%';
  document.getElementById('kpi-pct-sub').textContent = counts.done + ' de ' + total + ' atividades';

  // gráfico de rosca (percentuais exatos, sem arredondar, para o desenho ficar preciso)
  var colorVar = {done:'var(--green)', wip:'var(--amber)', blocked:'var(--red)', todo:'var(--gray)'};
  var cum = 0, stops = [];
  order.forEach(function(k){
    var start = cum;
    cum += total ? (counts[k] / total * 100) : 0;
    stops.push(colorVar[k] + ' ' + start.toFixed(2) + '% ' + cum.toFixed(2) + '%');
  });
  document.getElementById('donut').style.background = 'conic-gradient(' + stops.join(',') + ')';
  document.getElementById('donut-pct-label').textContent = pct.done + '%';

  // legenda
  order.forEach(function(k){
    document.getElementById('legend-label-' + k).textContent = DATA.statusLabels[k];
    document.getElementById('legend-n-' + k).textContent = counts[k] + ' · ' + pct[k] + '%';
  });

  // círculo da fase "Desenvolvimento"
  document.getElementById('phase-dev-circ').textContent = pct.done + '%';

  // listas por status
  order.forEach(function(k){
    var items = DATA.activities.filter(function(a){ return a.status === k; });
    document.getElementById('list-' + k).innerHTML = items.map(renderItem).join('');
  });

  showTab('done');
}

function renderPhases(){
  var p = DATA.phases;

  document.getElementById('phase-assessment-name').textContent = p.assessment.name;
  document.getElementById('phase-assessment-status').textContent = p.assessment.statusLabel;
  document.getElementById('phase-assessment-date').textContent = p.assessment.date;

  document.getElementById('phase-dev-name').textContent = p.dev.name;
  document.getElementById('phase-dev-status').textContent = p.dev.statusLabel;
  document.getElementById('phase-dev-date').textContent = p.dev.dateRange;

  document.getElementById('phase-hml-name').textContent = p.hml.name;
  document.getElementById('phase-hml-status').textContent = p.hml.statusLabel;
  document.getElementById('phase-hml-date').textContent = p.hml.date;
  document.getElementById('list-hml').innerHTML = p.hml.activities.map(renderItem).join('');

  document.getElementById('phase-golive-name').textContent = p.golive.name;
  document.getElementById('phase-golive-status').textContent = p.golive.statusLabel;
  document.getElementById('phase-golive-date').textContent = p.golive.date;
  document.getElementById('list-golive').innerHTML = p.golive.activities.map(renderItem).join('');
}

function renderProgressBlock(items, barId, badgeId, listId, verb){
  var done = items.filter(function(i){ return i.status === 'done'; }).length;
  var total = items.length;
  var pctv = total ? Math.round(done / total * 100) : 0;
  document.getElementById(barId).style.width = pctv + '%';
  document.getElementById(badgeId).textContent = done + ' de ' + total + ' ' + verb;
  document.getElementById(listId).innerHTML = items.map(renderItem).join('');
}

function showTab(tab){
  ['done','wip','blocked','todo'].forEach(function(t){
    document.getElementById('list-' + t).style.display = (t === tab) ? 'flex' : 'none';
  });
  document.querySelectorAll('.legend .row').forEach(function(row){
    row.classList.toggle('active', row.dataset.tab === tab);
  });
  document.getElementById('list-title').innerHTML = DATA.statusLabels[tab] + ' <span class="count-badge">' + STATS.counts[tab] + '</span>';
}

var phaseKeys = ['dev','hml','golive'];
function togglePhase(key){
  var panelId = (key === 'dev') ? 'dev-details' : 'phase-' + key;
  var panel = document.getElementById(panelId);
  var wasOpen = panel.style.display === 'block';

  phaseKeys.forEach(function(k){
    document.getElementById(k === 'dev' ? 'dev-details' : 'phase-' + k).style.display = 'none';
    document.getElementById('phase-step-' + k).classList.remove('open');
  });

  if(!wasOpen){
    panel.style.display = 'block';
    document.getElementById('phase-step-' + key).classList.add('open');
  }
}

function renderAll(){
  renderMeta();
  renderActivities();
  renderPhases();
  renderProgressBlock(DATA.documentacoes, 'docs-bar', 'docs-badge', 'list-docs', 'entregues');
  renderProgressBlock(DATA.evidencias, 'evid-bar', 'evid-badge', 'list-evid', 'compartilhadas');
}

document.addEventListener('DOMContentLoaded', renderAll);
</script>
