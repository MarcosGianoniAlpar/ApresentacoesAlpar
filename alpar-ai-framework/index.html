<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alpar Value AI · Framework de IA</title>
<meta name="description" content="Alpar Value AI: metodologia executiva para levar IA do piloto à operação com valor verificável." />
<meta name="theme-color" content="#010C1D" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23010C1D'/%3E%3Ccircle cx='11' cy='16' r='3.4' fill='%2336AFFD'/%3E%3Ccircle cx='21' cy='11' r='3.4' fill='%23049DD9'/%3E%3Ccircle cx='21' cy='21' r='3.4' fill='%238CD35A'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-0:#010C1D; --bg-1:#04122A; --bg-2:#0A1E3D;
  --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --ink:#EAF1FB; --ink-2:#A2B2D0; --muted:#5F7099;
  --blue:#049DD9; --blue-lt:#36AFFD; --blue-vivid:#3EA9FF;
  --green:#8CD35A; --green-lt:#B7E88C; --teal:#03A688;
  --navy-card:#0C2044;
  --r:18px; --ease:cubic-bezier(.22,.61,.36,1);
  --pad-x:clamp(28px,5vw,86px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Montserrat",system-ui,-apple-system,sans-serif;
  background:var(--bg-0); color:var(--ink);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%;display:block}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------- Ambient background ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1340px 980px at 82% -14%, rgba(36,96,144,.44), transparent 62%),
    radial-gradient(1060px 860px at 0% 110%, rgba(22,60,98,.34), transparent 60%),
    linear-gradient(158deg,#0D2139 0%,#091A30 55%,#071121 100%);
}
.ambient::after{content:"";position:absolute;inset:0;opacity:.24;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-mask-image:radial-gradient(1050px 620px at 84% 0%,#000,transparent 72%);
  mask-image:radial-gradient(1050px 620px at 84% 0%,#000,transparent 72%);}
.orb{position:fixed;border-radius:50%;border:1px solid var(--line);z-index:0;pointer-events:none}
.orb.a{width:680px;height:680px;right:-240px;top:-280px;border-color:rgba(54,175,253,.07)}
.orb.b{width:440px;height:440px;left:-180px;bottom:-190px;border-color:rgba(140,211,90,.045)}

/* ---------- Deck / slides ---------- */
.deck{position:fixed;inset:0;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(58px,7.5vh,84px) var(--pad-x) clamp(56px,7vh,76px);
  opacity:0;visibility:hidden;transform:translateY(26px) scale(.994);
  transition:opacity .6s var(--ease),transform .7s var(--ease),visibility .6s;}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:3}
.slide.prev{transform:translateY(-22px) scale(.994)}
.slide-inner{width:100%;max-width:1220px;margin:0 auto}

/* reveal */
[data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.slide.active [data-reveal]{opacity:1;transform:none}

/* ---------- Typography blocks ---------- */
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;color:var(--blue-lt)}
.kicker::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:2px}
h1.title{font-weight:800;line-height:1.03;letter-spacing:-.02em;
  font-size:clamp(38px,5.6vw,74px)}
h2.title{font-weight:800;line-height:1.05;letter-spacing:-.015em;
  font-size:clamp(30px,3.9vw,52px)}
.title .hl{color:var(--blue-lt)}
.lead{color:var(--ink-2);font-weight:400;font-size:clamp(15px,1.32vw,19px);line-height:1.55;max-width:60ch}
.shead{margin-bottom:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.slide-head{margin-bottom:clamp(18px,3vh,34px)}

/* ---------- Cards / chips ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(6px)}
.card.soft{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02))}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink)}
.chip.green{border-color:rgba(140,211,90,.4);background:rgba(140,211,90,.10);color:var(--green-lt)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--blue-lt)}

/* logo chip */
.logo-chip{background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;
  padding:14px 16px;height:76px;transition:transform .3s var(--ease),box-shadow .3s}
.logo-chip img{max-height:100%;max-width:100%;width:auto;object-fit:contain}
.logo-chip:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.35)}

/* ---------- Chrome (nav UI) ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:0 var(--pad-x);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
.brand img{height:26px;width:auto;opacity:.96}
.brand .x{color:var(--muted);font-weight:600;font-size:13px}
.brand .sn{color:var(--ink-2);font-weight:600;font-size:13px;letter-spacing:.02em}
.counter{pointer-events:auto;font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--ink-2)}
.counter b{color:var(--ink);font-size:15px}
.progress{position:fixed;top:0;left:0;height:3px;z-index:21;
  background:linear-gradient(90deg,var(--blue),var(--blue-lt) 55%,var(--green));
  width:0;transition:width .6s var(--ease);box-shadow:0 0 12px rgba(54,175,253,.6)}

/* dots */
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.dot-btn{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-family:inherit}
.dot-btn .lbl{font-size:11.5px;font-weight:600;opacity:0;transform:translateX(6px);
  transition:opacity .25s,transform .25s;white-space:nowrap;color:var(--ink-2)}
.dot-btn .pt{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);
  transition:all .3s var(--ease);flex:none}
.dot-btn:hover .lbl{opacity:1;transform:none}
.dot-btn:hover .pt{background:var(--ink-2)}
.dot-btn.on .pt{background:var(--blue-lt);box-shadow:0 0 0 4px rgba(54,175,253,.18);transform:scale(1.05)}
.dot-btn.on .lbl{opacity:1;transform:none;color:var(--ink)}

/* bottom controls */
.controls{position:fixed;bottom:18px;right:var(--pad-x);z-index:20;display:flex;gap:10px;align-items:center}
.ctl{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s,transform .2s;backdrop-filter:blur(6px)}
.ctl:hover{background:var(--panel-2);border-color:var(--blue-lt);transform:translateY(-2px)}
.ctl:disabled{opacity:.32;cursor:default;transform:none}
.ctl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{position:fixed;bottom:24px;left:var(--pad-x);z-index:20;color:var(--muted);font-size:12px;font-weight:500;
  display:flex;gap:14px;align-items:center;transition:opacity .5s}
.hint kbd{font-family:inherit;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;font-size:11px;
  background:var(--panel);color:var(--ink-2);font-weight:600}
.confidential{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:19;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;opacity:.7}

/* grid overview */
.grid-ov{position:fixed;inset:0;z-index:40;background:rgba(2,8,20,.94);backdrop-filter:blur(12px);
  padding:clamp(30px,5vw,64px);overflow:auto;opacity:0;visibility:hidden;transition:opacity .3s}
.grid-ov.open{opacity:1;visibility:visible}
.grid-ov h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-bottom:22px;font-weight:700}
.grid-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px;cursor:pointer;
  transition:border-color .2s,transform .2s,background .2s;min-height:120px;display:flex;flex-direction:column;gap:8px}
.gcard:hover{border-color:var(--blue-lt);transform:translateY(-3px);background:var(--panel-2)}
.gcard .gn{font-size:12px;font-weight:700;color:var(--blue-lt)}
.gcard .gt{font-size:15px;font-weight:700;line-height:1.25}
.gcard .gd{font-size:12px;color:var(--ink-2);margin-top:auto}
.gcard.on{border-color:var(--green)}

/* ---------- Lock / login ---------- */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1180px 820px at 80% -12%, rgba(36,96,144,.44), transparent 62%),
    linear-gradient(158deg,#0D2139 0%,#091A30 55%,#071121 100%);
  transition:opacity .4s var(--ease)}
#lock.out{opacity:0;pointer-events:none}
.lock-card{width:min(460px,92vw);border:1px solid var(--line-2);border-radius:22px;padding:40px 40px 34px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(10px);
  box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lock-mark{display:flex;align-items:center;gap:9px;margin-bottom:26px}
.lock-mark span{font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.lock-mark .lx{font-style:normal;color:var(--muted);font-weight:600}
.lock-mark .lsn{font-weight:600;font-size:15px;color:var(--ink-2)}
.lock-eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blue-lt)}
.lock-card h1{font-size:26px;font-weight:800;letter-spacing:-.015em;margin:10px 0 8px;line-height:1.15}
.lock-card p{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:22px}
#lockForm{display:flex;flex-direction:column;gap:10px}
#lockUser,#lockPw{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:11px;
  padding:13px 15px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;transition:border-color .2s}
#lockUser:focus,#lockPw:focus{border-color:var(--blue-lt);box-shadow:0 0 0 3px rgba(54,175,253,.16)}
#lockBtn{border:none;border-radius:11px;padding:13px 22px;width:100%;margin-top:2px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
  color:#031126;background:linear-gradient(180deg,var(--blue-lt),var(--blue));transition:filter .2s,transform .2s}
#lockBtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
#lockBtn:disabled{opacity:.6;cursor:default;transform:none}
.lock-err{margin-top:14px;font-size:13px;font-weight:600;color:#FF9AA0;opacity:0;transform:translateY(-4px);
  transition:opacity .2s,transform .2s;pointer-events:none}
.lock-err.show{opacity:1;transform:none}

/* ---------- Utility layout ---------- */
.grid{display:grid;gap:clamp(16px,2vw,26px)}
.two{grid-template-columns:1fr 1fr}
.two-a{grid-template-columns:1.05fr .95fr}
.two-b{grid-template-columns:.62fr 1.38fr}
.three{grid-template-columns:repeat(3,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.wrap{flex-wrap:wrap}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.center{align-items:center}.between{justify-content:space-between}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}

/* stat */
.stat .n{font-weight:800;letter-spacing:-.02em;line-height:1;font-size:clamp(30px,3.3vw,46px);white-space:nowrap}
.stat .n .u{color:var(--blue-lt);font-size:.5em;margin-left:5px;font-weight:700}
.stat .n.g .u{color:var(--green)}
.stat .l{color:var(--ink-2);font-size:13px;font-weight:500;margin-top:7px;line-height:1.35}

/* icon rows */
.irow{display:flex;gap:16px;align-items:flex-start;padding:15px 0}
.irow+.irow{border-top:1px solid var(--line)}
.ico{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(54,175,253,.12);border:1px solid rgba(54,175,253,.28)}
.ico.green{background:rgba(140,211,90,.12);border-color:rgba(140,211,90,.3)}
.ico svg{width:22px;height:22px;stroke:var(--blue-lt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.green svg{stroke:var(--green)}
.irow h4{font-size:16px;font-weight:700;margin-bottom:3px}
.irow p{font-size:13.5px;color:var(--ink-2);line-height:1.5}

/* small caps label */
.slabel{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* bars breakdown */
.hbar{display:grid;grid-template-columns:150px 1fr 52px;gap:14px;align-items:center;padding:8px 0;font-size:13.5px}
.hbar .track{height:9px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;transform:scaleX(0);transform-origin:left;
  transition:transform 1s var(--ease)}
.slide.active .hbar .fill{transform:scaleX(1)}
.hbar .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hbar .lab{color:var(--ink-2);font-weight:600}

svg .drawline{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset 1.4s var(--ease) .3s}
.slide.active svg .drawline{stroke-dashoffset:0}
svg .growbar{transform:scaleY(0);transform-origin:bottom;transition:transform .9s var(--ease)}
.slide.active svg .growbar{transform:scaleY(1)}
svg .fadein{opacity:0;transition:opacity .6s ease .5s}
.slide.active svg .fadein{opacity:1}
.ring-p{transition:stroke-dashoffset 1.2s var(--ease) .2s}

/* timeline */
.tl{margin-top:24px}
.tl-heads{display:grid;grid-template-columns:repeat(5,1fr)}
.tl-head{padding:0 16px}
.tl-head:not(:last-child){border-right:1px solid var(--line)}
.tl-yr{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.tl-t{font-size:clamp(15px,1.35vw,19px);font-weight:800;color:var(--blue-lt);line-height:1.2;margin-top:6px}
.tl-rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:34px;margin:16px 0}
.tl-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:linear-gradient(90deg,var(--blue),var(--green));
  transform:translateY(-50%) scaleX(0);transform-origin:left;transition:transform 1.3s var(--ease);z-index:0}
.slide.active .tl-line{transform:translateY(-50%) scaleX(1)}
.tl-cell{display:flex;align-items:center;justify-content:center;z-index:1}
.tl-node{width:16px;height:16px;border-radius:50%;background:var(--bg-0);border:3px solid var(--blue-lt);box-shadow:0 0 0 5px rgba(54,175,253,.14)}
.tl-node.last{border-color:var(--green);box-shadow:0 0 0 5px rgba(140,211,90,.16)}
.tl-bullets{display:grid;grid-template-columns:repeat(5,1fr);margin-top:2px}
.tl-bullets ul{list-style:none;display:flex;flex-direction:column;gap:9px;padding:0 16px}
.tl-bullets li{font-size:12.5px;color:var(--ink-2);line-height:1.4;padding-left:14px;position:relative}
.tl-bullets li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.tl-bullets ul:last-child li::before{background:var(--green)}

/* case study */
.case-flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.cbox{border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;background:var(--panel)}
.cbox.res{border-color:rgba(140,211,90,.32);background:rgba(140,211,90,.06)}
.cbox h5{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:10px;color:var(--blue-lt)}
.cbox.res h5{color:var(--green)}
.cbox ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.cbox li{font-size:12.5px;color:var(--ink-2);line-height:1.42;padding-left:15px;position:relative}
.cbox li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--blue-lt)}
.cbox.res li::before{background:var(--green)}
.photo{border-radius:14px;overflow:hidden;border:1px solid var(--line-2)}
.photo img{width:100%;height:100%;object-fit:cover}
.stackpill{display:flex;flex-wrap:wrap;gap:7px}
.stackpill span{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2)}

/* partner ladder */
.ladder{display:flex;align-items:center;gap:0;margin:8px 0 4px}
.rung{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.rung .bar{height:6px;width:100%;background:var(--green);border-radius:4px}
.rung.future .bar{background:linear-gradient(90deg,var(--green) 0 46%,rgba(255,255,255,.12) 46%)}
.rung .pct{position:absolute;top:-20px;left:46%;transform:translateX(-50%);font-size:12.5px;font-weight:800;color:var(--green-lt);white-space:nowrap}
.rung .rnode{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--green);color:#04240a;font-weight:800;font-size:15px;z-index:1}
.rung.future .rnode{background:rgba(255,255,255,.1);border:2px dashed var(--line-2);color:var(--ink-2)}
.rung.current .rnode{background:var(--blue-lt);color:#031126;box-shadow:0 0 0 6px rgba(54,175,253,.2)}
.rung .rlbl{font-size:13px;font-weight:700;margin-top:2px}
.rung .rsub{font-size:11px;color:var(--muted);font-weight:600}

/* ---------- AI Value section ---------- */
.pcol{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.pcol .ph{padding:12px 14px;font-weight:800;font-size:14px;color:#04121f;line-height:1.2}
.pcol .pb{padding:14px;display:flex;flex-direction:column;gap:9px}
.pcol .psub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pcol .pi{font-size:12px;color:var(--ink-2);line-height:1.35;padding-left:13px;position:relative}
.pcol .pi::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--blue-lt)}

.htable{width:100%;border-collapse:collapse;font-size:12.5px}
.htable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-lt);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.htable th.r,.htable td.n{text-align:right}
.htable th.c,.htable td.c{text-align:center}
.htable td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);line-height:1.3}
.htable td.s{color:var(--ink);font-weight:600}
.htable td.n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.htable td.rk{font-weight:800;color:var(--blue-lt);text-align:center}
.htable td.rk.dim{color:var(--muted)}
.htable tr:last-child td{border-bottom:none}

.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-size:11px;font-weight:700}
.pill.hi{background:rgba(140,211,90,.16);color:#A9E07E}
.pill.md{background:rgba(224,178,75,.16);color:#E6C06B}
.pill.lo{background:rgba(214,120,120,.15);color:#E3A0A0}

.gantt-row{display:grid;grid-template-columns:150px repeat(12,1fr);gap:0 5px;align-items:center;padding:5px 0}
.gantt-row.gantt-head{padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.gantt-head .gh{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.gantt-row .glab{font-size:12.5px;font-weight:600;color:var(--ink)}
.gbar{height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#04121f;white-space:nowrap;overflow:hidden;padding:0 8px;
  transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.slide.active .gbar{transform:scaleX(1)}

.video-frame{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);
  background:linear-gradient(135deg,#0B1E3A,#061225);display:flex;align-items:center;justify-content:center}
.video-frame::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 260px at 50% 42%,rgba(54,175,253,.12),transparent 70%)}
.video-frame .play{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:1}
.video-frame .play::after{content:"";width:0;height:0;border-left:19px solid var(--blue-lt);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.video-frame .vlabel{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700;z-index:1}
.video-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-portrait{height:min(62vh,590px);aspect-ratio:888/1920;border-radius:24px;overflow:hidden;
  border:1px solid var(--line-2);background:#05101f;box-shadow:0 22px 55px rgba(0,0,0,.5);margin:0 auto}
.video-portrait video{display:block;width:100%;height:100%;object-fit:contain;background:#05101f}
.video-landscape{border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:#05101f;box-shadow:0 18px 45px rgba(0,0,0,.42)}
.video-landscape video{display:block;width:100%;height:auto;background:#05101f}

.clist{list-style:none;display:flex;flex-direction:column;gap:8px}
.clist li{font-size:12.5px;color:var(--ink-2);line-height:1.4;padding-left:15px;position:relative}
.clist li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--blue-lt)}
.clist.g li::before{background:var(--green)}

@media (max-width:900px){
  .two,.two-a,.two-b,.three,.four,.case-flow,.tl,.grid.two,.grid.three{grid-template-columns:1fr!important}
  .tl-rail{display:none}.tl-heads,.tl-bullets{grid-template-columns:1fr}.tl-head{border-right:none!important;border-bottom:1px solid var(--line);padding:12px 0}.tl-bullets ul{padding:8px 0 4px}
  .dots{display:none}.hint{display:none}
  .slide{justify-content:flex-start;overflow-y:auto;padding-top:80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="orb a"></div><div class="orb b"></div>
<div class="progress" id="progress"></div>

<div class="topbar">
  <div class="brand">
    <img data-logo="alpar_white" alt="Alpar" />
  </div>
  <div class="counter"><b id="cur">01</b> / <span id="total">12</span></div>
</div>

<div class="deck" id="deck">
</div><!-- /deck -->

<div class="dots" id="dots"></div>

<div class="controls">
  <button class="ctl" id="btnGrid" title="Overview (G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
  <button class="ctl" id="btnFull" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ctl" id="btnPrev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="ctl" id="btnNext" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<div class="hint" id="hint"><span><kbd>←</kbd> <kbd>→</kbd> navegar</span><span><kbd>G</kbd> visão geral</span><span><kbd>F</kbd> tela cheia</span></div>
<div class="confidential">Confidencial</div>

<div class="grid-ov" id="gridOv">
  <h3>Todos os slides · clique para navegar</h3>
  <div class="grid-wrap" id="gridWrap"></div>
</div>

<div id="lock">
  <div class="lock-card">
    <div class="lock-mark">
      <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="10" cy="16" r="3.6" fill="#36AFFD"/><circle cx="21" cy="10.5" r="3.6" fill="#049DD9"/><circle cx="21" cy="21.5" r="3.6" fill="#8CD35A"/></svg>
      <span>alpar</span>
    </div>
    <div class="lock-eyebrow">Alpar Value AI · Confidencial</div>
    <h1>Alpar Value AI</h1>
    <p>Apresentação protegida. Informe as credenciais para continuar.</p>
    <form id="lockForm" autocomplete="off">
      <input id="lockUser" type="text" placeholder="Usuário" autocomplete="off" spellcheck="false" autocapitalize="off" />
      <input id="lockPw" type="password" placeholder="Senha" autocomplete="off" spellcheck="false" />
      <button type="submit" id="lockBtn">Entrar</button>
    </form>
    <div id="lockErr" class="lock-err">Credenciais incorretas. Tente novamente.</div>
  </div>
</div>

<script>
function initDeck(){
  "use strict";
  var L = window.ALPAR_LOGOS || {};
  var D = window.ALPAR_DATA || {};
  document.querySelectorAll('[data-logo]').forEach(function(img){
    if(L[img.dataset.logo]) img.src = L[img.dataset.logo];
  });

  /* ---- Logo wall (slide 6) ---- */
  var WALL = [
    {v:'Industrial', k:['abinbev','brf','boticario','inpev','klabin','tigre']},
    {v:'Retail', k:['cassol','assai','casasbahia']},
    {v:'Financial Services', k:['itau','vrbrasil']},
    {v:'Services', k:['kpmg','ogfi','semparar','crossfuze','chaintech','yssy']},
    {v:'Education', k:['afya','fiep']},
    {v:'Others', k:['gol','raizen','sabesp','servicenow']}
  ];
  var wall = document.getElementById('logoWall');
  if(wall) WALL.forEach(function(group){
    var col = document.createElement('div');
    col.style.cssText='display:flex;flex-direction:column;gap:10px';
    var h = document.createElement('div');
    h.className='slabel'; h.textContent=group.v; h.style.cssText+=';text-align:center;margin-bottom:2px';
    col.appendChild(h);
    group.k.forEach(function(key){
      var chip=document.createElement('div'); chip.className='logo-chip'; chip.style.height='64px';
      var img=document.createElement('img'); img.src=L[key]||''; img.alt=key;
      chip.appendChild(img); col.appendChild(chip);
    });
    wall.appendChild(col);
  });

  /* ================= Deck engine ================= */
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var N = slides.length, cur = 0, charted = {};
  document.getElementById('total').textContent = String(N).padStart(2,'0');

  var dotsWrap = document.getElementById('dots');
  slides.forEach(function(s,i){
    var b=document.createElement('button'); b.className='dot-btn';
    b.innerHTML='<span class="lbl">'+s.dataset.title+'</span><span class="pt"></span>';
    b.addEventListener('click',function(){go(i)});
    dotsWrap.appendChild(b);
  });
  var dotBtns = Array.prototype.slice.call(dotsWrap.children);

  var gridWrap=document.getElementById('gridWrap');
  slides.forEach(function(s,i){
    var c=document.createElement('div'); c.className='gcard';
    var t=s.querySelector('.title'); var tt=t?t.textContent.trim():s.dataset.title;
    c.innerHTML='<div class="gn">'+String(i+1).padStart(2,'0')+'</div><div class="gt">'+s.dataset.title+'</div><div class="gd">'+tt.slice(0,64)+'</div>';
    c.addEventListener('click',function(){go(i);closeGrid()});
    gridWrap.appendChild(c);
  });
  var gcards=Array.prototype.slice.call(gridWrap.children);

  function setReveal(slide){
    var els=slide.querySelectorAll('[data-reveal]');
    els.forEach(function(el,i){ el.style.transitionDelay=(0.06+i*0.09)+'s'; });
  }
  slides.forEach(setReveal);

  function go(n, initial){
    n = Math.max(0, Math.min(N-1, n));
    if(n===cur && !initial) return;
    slides.forEach(function(s,i){
      s.classList.remove('active','prev');
      if(i===n) s.classList.add('active');
      else if(i<n) s.classList.add('prev');
    });
    cur=n;
    document.getElementById('cur').textContent=String(n+1).padStart(2,'0');
    document.getElementById('progress').style.width=((n)/(N-1)*100)+'%';
    dotBtns.forEach(function(b,i){b.classList.toggle('on',i===n)});
    gcards.forEach(function(c,i){c.classList.toggle('on',i===n)});
    document.getElementById('btnPrev').disabled = n===0;
    document.getElementById('btnNext').disabled = n===N-1;
    if(location.hash!=='#'+(n+1)) history.replaceState(null,'','#'+(n+1));
    runCounters(slides[n]);
    if(!charted[n]){ buildCharts(n); charted[n]=true; }
  }

  /* ---- counters ---- */
  function runCounters(slide){
    slide.querySelectorAll('[data-count]').forEach(function(el){
      if(el.dataset.done==='1') return;
      var target=parseFloat(el.dataset.count), dec=parseInt(el.dataset.dec||'0',10);
      var pre=el.dataset.prefix||'', suf=el.dataset.suffix||'';
      var uSpan=el.querySelector('.u'); var uHTML=uSpan?uSpan.outerHTML:'';
      var t0=null, dur=1050;
      function fmt(v){ return pre+v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf+uHTML; }
      function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur); var e=1-Math.pow(1-p,3);
        el.innerHTML=fmt(target*e); if(p<1) requestAnimationFrame(step); else {el.innerHTML=fmt(target); el.dataset.done='1';} }
      requestAnimationFrame(step);
    });
  }

  /* ================= Charts ================= */
  var NS='http://www.w3.org/2000/svg';
  function el(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}

  function buildFinancial(){
    var host=document.getElementById('finChart'); if(!host||host.children.length) return;
    var W=560,H=300, mL=8,mR=8,mT=18,mB=44, iw=W-mL-mR, ih=H-mT-mB;
    var f=D.fin||{};
    var years=f.years||[], rev=f.rev||[], sn=f.sn||[], gm=f.gm||[], em=f.em||[];
    var maxV=f.max||16;
    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:'100%',preserveAspectRatio:'xMidYMid meet'});
    // gridlines
    for(var g=0;g<=4;g++){var gy=mT+ih-(g/4)*ih; svg.appendChild(el('line',{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:'rgba(255,255,255,.07)','stroke-width':1}));}
    var band=iw/years.length, bw=band*0.3, gap=band*0.06;
    years.forEach(function(yr,i){
      var cx=mL+band*i+band/2;
      var hR=(rev[i]/maxV)*ih, hS=(sn[i]/maxV)*ih;
      var x1=cx-bw-gap/2, x2=cx+gap/2;
      var b1=el('rect',{x:x1,y:mT+ih-hR,width:bw,height:hR,rx:3,fill:'url(#gRev)'}); b1.setAttribute('class','growbar'); b1.style.transitionDelay=(0.15+i*0.08)+'s';
      var b2=el('rect',{x:x2,y:mT+ih-hS,width:bw,height:hS,rx:3,fill:'url(#gSn)'}); b2.setAttribute('class','growbar'); b2.style.transitionDelay=(0.2+i*0.08)+'s';
      svg.appendChild(b1); svg.appendChild(b2);
      var lab=el('text',{x:x1+bw/2,y:mT+ih-hR-7,'text-anchor':'middle',fill:'#EAF1FB','font-size':12,'font-weight':700,'font-family':'Montserrat'}); lab.textContent='$'+rev[i].toFixed(1); lab.setAttribute('class','fadein'); svg.appendChild(lab);
      var xl=el('text',{x:cx,y:H-mB+20,'text-anchor':'middle',fill:'#A2B2D0','font-size':11.5,'font-family':'Montserrat'}); xl.textContent=yr; svg.appendChild(xl);
    });
    // margin lines (secondary scale 0..60%)
    function ptx(i){return mL+band*i+band/2;}
    function pty(v){return mT+ih-(v/60)*ih;}
    function line(data,color,dash){
      var d='M'; data.forEach(function(v,i){d+=(i?'L':'')+ptx(i).toFixed(1)+' '+pty(v).toFixed(1)+' ';});
      var p=el('path',{d:d,fill:'none',stroke:color,'stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'});
      if(dash){ p.setAttribute('stroke-dasharray','7 7'); p.setAttribute('class','fadein'); }
      else { p.setAttribute('class','drawline'); p.style.setProperty('--len','1200'); }
      svg.appendChild(p);
      data.forEach(function(v,i){var c=el('circle',{cx:ptx(i),cy:pty(v),r:3.2,fill:color}); c.setAttribute('class','fadein'); svg.appendChild(c);});
    }
    var defs=el('defs',{});
    var g1=el('linearGradient',{id:'gRev',x1:0,y1:0,x2:0,y2:1}); g1.appendChild(el('stop',{offset:'0%','stop-color':'#4FB8FF'})); g1.appendChild(el('stop',{offset:'100%','stop-color':'#0C6FB0'})); defs.appendChild(g1);
    var g2=el('linearGradient',{id:'gSn',x1:0,y1:0,x2:0,y2:1}); g2.appendChild(el('stop',{offset:'0%','stop-color':'#A6E077'})); g2.appendChild(el('stop',{offset:'100%','stop-color':'#5FA83A'})); defs.appendChild(g2);
    svg.insertBefore(defs,svg.firstChild);
    line(gm,'#36AFFD',false); line(em,'#8CD35A',true);
    host.appendChild(svg);
  }

  function buildHeadcount(){
    var host=document.getElementById('hcChart'); if(!host||host.children.length) return;
    var W=440,H=200,mB=40,mT=26,mL=6,mR=6, iw=W-mL-mR, ih=H-mT-mB;
    var hc=D.hc||{};
    var yrs=hc.years||[], v=hc.v||[], yoy=hc.yoy||[];
    var maxV=hc.max||210, band=iw/yrs.length, bw=band*0.5;
    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});
    var defs=el('defs',{}); var g=el('linearGradient',{id:'gHc',x1:0,y1:0,x2:0,y2:1});
    g.appendChild(el('stop',{offset:'0%','stop-color':'#4FB8FF'})); g.appendChild(el('stop',{offset:'100%','stop-color':'#0C6FB0'})); defs.appendChild(g); svg.appendChild(defs);
    yrs.forEach(function(yr,i){
      var cx=mL+band*i+band/2, h=(v[i]/maxV)*ih, x=cx-bw/2;
      var last=i===yrs.length-1;
      var b=el('rect',{x:x,y:mT+ih-h,width:bw,height:h,rx:4,fill:last?'url(#gHc)':'url(#gHc)'}); if(last)b.setAttribute('fill','#8CD35A');
      b.setAttribute('class','growbar'); b.style.transitionDelay=(0.1+i*0.09)+'s'; svg.appendChild(b);
      var t=el('text',{x:cx,y:mT+ih-h-7,'text-anchor':'middle',fill:'#EAF1FB','font-size':13,'font-weight':700,'font-family':'Montserrat'}); t.textContent=v[i]; t.setAttribute('class','fadein'); svg.appendChild(t);
      var xl=el('text',{x:cx,y:H-mB+18,'text-anchor':'middle',fill:'#A2B2D0','font-size':11,'font-family':'Montserrat'}); xl.textContent=yr; svg.appendChild(xl);
      if(yoy[i]){var y2=el('text',{x:cx,y:H-mB+33,'text-anchor':'middle',fill:'#5F7099','font-size':10,'font-family':'Montserrat','font-weight':600}); y2.textContent=yoy[i]; svg.appendChild(y2);}
    });
    host.appendChild(svg);
  }

  function donut(hostId,segs,size){
    var host=document.getElementById(hostId); if(!host||host.children.length) return;
    size=size||128; var r=size/2-10, cx=size/2, cy=size/2, C=2*Math.PI*r, off=0;
    var svg=el('svg',{viewBox:'0 0 '+size+' '+size,width:size,height:size});
    svg.appendChild(el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:'rgba(255,255,255,.08)','stroke-width':14}));
    segs.forEach(function(s,i){
      var len=C*s.val;
      var arc=el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:s.color,'stroke-width':14,'stroke-linecap':'butt',
        'stroke-dasharray':len+' '+(C-len),'stroke-dashoffset':C*0.25-off,transform:'rotate(0 '+cx+' '+cy+')'});
      arc.style.strokeDasharray='0 '+C; arc.setAttribute('class','ring-p');
      svg.appendChild(arc);
      (function(a,l){ setTimeout(function(){a.style.strokeDasharray=l+' '+(C-l);}, 260+i*180); })(arc,len);
      off+=len;
    });
    host.appendChild(svg);
  }

  function buildWaterfall(){
    var host=document.getElementById('waterfall'); if(!host||host.children.length) return;
    var W=520,H=300,mL=8,mR=8,mT=20,mB=58, iw=W-mL-mR, ih=H-mT-mB;
    var steps=D.wf||[];
    var maxV=D.wfMax||12, band=iw/steps.length, bw=band*0.52;
    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});
    for(var g=0;g<=3;g++){var gy=mT+ih-(g/3)*ih; svg.appendChild(el('line',{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:'rgba(255,255,255,.06)','stroke-width':1}));}
    var cum=0;
    steps.forEach(function(s,i){
      var cx=mL+band*i+band/2, x=cx-bw/2, h, y, color;
      if(s.type==='base'){ h=(s.v/maxV)*ih; y=mT+ih-h; cum=s.v; color='#0F2E52'; }
      else if(s.type==='add'){ h=(s.v/maxV)*ih; y=mT+ih-((cum+s.v)/maxV)*ih; cum+=s.v; color='#36AFFD'; }
      else { h=(s.v/maxV)*ih; y=mT+ih-h; color='#8CD35A'; }
      var b=el('rect',{x:x,y:y,width:bw,height:Math.max(h,2),rx:3,fill:color}); b.setAttribute('class','growbar'); b.style.transformOrigin=(y+h)+'px'; b.style.transitionDelay=(0.12+i*0.12)+'s'; svg.appendChild(b);
      var t=el('text',{x:cx,y:y-7,'text-anchor':'middle',fill:'#EAF1FB','font-size':11.5,'font-weight':700,'font-family':'Montserrat'}); t.textContent='$'+s.v.toFixed(2); t.setAttribute('class','fadein'); svg.appendChild(t);
      // wrap label into up to 2 lines
      var words=s.l.split(' '), lines=[], line='';
      words.forEach(function(w){ if((line+' '+w).trim().length>16){lines.push(line.trim());line=w;} else line+=' '+w; }); lines.push(line.trim());
      lines.forEach(function(ln,li){ var xl=el('text',{x:cx,y:H-mB+18+li*12,'text-anchor':'middle',fill:'#A2B2D0','font-size':10,'font-family':'Montserrat'}); xl.textContent=ln; svg.appendChild(xl); });
      if(s.type==='add'){ var conn=el('line',{x1:mL+band*(i-1)+band/2+bw/2,y1:mT+ih-(cum-s.v)/maxV*ih,x2:x,y2:mT+ih-(cum-s.v)/maxV*ih,stroke:'rgba(255,255,255,.25)','stroke-width':1,'stroke-dasharray':'3 3'}); svg.appendChild(conn);}
    });
    host.appendChild(svg);
  }

  function buildCharts(n){
    var title=slides[n].dataset.title;
    if(title==='Financial Profile') buildFinancial();
    if(title==='Structure'){ buildHeadcount(); donut('officeDonut',D.office||[],120); }
    if(title==='Revenue Visibility'){ buildWaterfall(); donut('custDonut',D.cust||[],118); }
  }

  /* set service-model bar widths */
  (function(){
    var s5=document.querySelector('[data-title="What We Do"]');
    var vals=D.svc||[]; // last(managed) shown as full "New"
    var fills=s5?s5.querySelectorAll('.hbar .fill'):[];
    fills.forEach(function(f,i){ f.style.width=(vals[i]||0)+'%'; });
    // employee roster widths (slide 7): relative to largest
    var s7=document.querySelector('[data-title="Structure"]');
    var rv=D.roster||[]; var rmax=rv[0]||1; var rfills=s7?s7.querySelectorAll('.hbar .fill'):[];
    rfills.forEach(function(f,i){ f.style.width=((rv[i]||0)/rmax*100)+'%'; });
  })();

  /* ---- controls ---- */
  document.getElementById('btnPrev').addEventListener('click',function(){go(cur-1)});
  document.getElementById('btnNext').addEventListener('click',function(){go(cur+1)});
  document.getElementById('btnFull').addEventListener('click',toggleFull);
  document.getElementById('btnGrid').addEventListener('click',openGrid);
  var gridOv=document.getElementById('gridOv');
  function openGrid(){gridOv.classList.add('open')}
  function closeGrid(){gridOv.classList.remove('open')}
  gridOv.addEventListener('click',function(e){if(e.target===gridOv)closeGrid()});
  function toggleFull(){ if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){})(); } else { document.exitFullscreen(); } }

  document.addEventListener('keydown',function(e){
    var tn=(e.target&&e.target.tagName)||'';
    if(tn==='VIDEO'||tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT') return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
    else if(e.key==='ArrowDown'){e.preventDefault();go(cur+1);}
    else if(e.key==='ArrowUp'){e.preventDefault();go(cur-1);}
    else if(e.key==='Home'){e.preventDefault();go(0);}
    else if(e.key==='End'){e.preventDefault();go(N-1);}
    else if(e.key==='g'||e.key==='G'){ gridOv.classList.contains('open')?closeGrid():openGrid(); }
    else if(e.key==='f'||e.key==='F'){ toggleFull(); }
    else if(e.key==='Escape'){ closeGrid(); }
  });

async function decryptPayload(user, pw){
  var d=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});};
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(user+':'+pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(ENC.i)},key,d(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function boot(payload){
  window.ALPAR_LOGOS = payload.logos || {};
  window.ALPAR_DATA = payload.data || {};
  document.getElementById('deck').innerHTML = payload.html;
  initDeck();
}
(function(){
  var lock=document.getElementById('lock'), form=document.getElementById('lockForm'),
      user=document.getElementById('lockUser'), pw=document.getElementById('lockPw'),
      err=document.getElementById('lockErr'), btn=document.getElementById('lockBtn');
  function clearErr(){err.classList.remove('show');}
  user.addEventListener('input',clearErr); pw.addEventListener('input',clearErr);
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    btn.disabled=true; btn.textContent='Entrando...';
    try{
      var payload=await decryptPayload(user.value.trim(), pw.value);
      boot(payload);
      lock.classList.add('out');
      setTimeout(function(){ if(lock&&lock.parentNode) lock.parentNode.removeChild(lock); },420);
    }catch(ex){
      err.classList.add('show'); btn.disabled=false; btn.textContent='Entrar';
      pw.value=''; pw.focus();
    }
  });
  user.focus();
})();
</script>
